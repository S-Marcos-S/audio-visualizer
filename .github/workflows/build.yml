name: Build Audio Visualizer Release APK

on:
  push:
    branches:
      - main
      - test
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: Check Version in Commit
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check commit message for version
        id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Workflow manually triggered via workflow_dispatch, proceeding with build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "version=0.1.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Inspecting commit message:"
          printf '%s\n' "$COMMIT_MSG"

          # Match version pattern like v0.1.0, 0.1.0, etc.
          if printf '%s' "$COMMIT_MSG" | grep -qE '\b(v?[0-9]+\.[0-9]+(\.[0-9]+)?(-beta(\.[0-9]+)?)?)\b'; then
            DETECTED_VERSION=$(printf '%s' "$COMMIT_MSG" | grep -oE '\b(v?[0-9]+\.[0-9]+(\.[0-9]+)?(-beta(\.[0-9]+)?)?)\b' | head -n 1)
            echo "Version number detected in commit: $DETECTED_VERSION. Proceeding with build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "version=$DETECTED_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "No version number found in commit message. Skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Release APK with R8
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Aceitar Licenças do Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build visualizer daemon DEX
        run: |
          mkdir -p build/daemon_classes app/src/main/assets build/dex_output
          ANDROID_JAR=$(ls -1d $ANDROID_HOME/platforms/android-*/android.jar | sort -V | tail -n 1)
          D8_TOOL=$(ls -1d $ANDROID_HOME/build-tools/*/d8 | sort -V | tail -n 1)
          echo "Using Android Jar: $ANDROID_JAR"
          echo "Using D8 Tool: $D8_TOOL"
          javac -source 17 -target 17 -cp "$ANDROID_JAR" -d build/daemon_classes app/src/daemon/dev/viagaralauncher/visualizer/AudioVisualizerDaemon.java
          $D8_TOOL build/daemon_classes/dev/viagaralauncher/visualizer/*.class --min-api 26 --output build/dex_output/
          cp build/dex_output/classes.dex app/src/main/assets/visualizer_daemon.dex
          ls -la app/src/main/assets/visualizer_daemon.dex

      - name: Decode Keystore with Python (if secret exists)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 -c "
          import base64, os
          data = os.environ.get('KEYSTORE_BASE64', '').strip()
          if data:
              clean_data = ''.join(data.split())
              missing_padding = len(clean_data) % 4
              if missing_padding == 2:
                  clean_data += '=='
              elif missing_padding == 3:
                  clean_data += '='
              os.makedirs('app', exist_ok=True)
              with open('app/key01.jks', 'wb') as f:
                  f.write(base64.b64decode(clean_data))
              print('Keystore decodificada com sucesso.')
          else:
              print('KEYSTORE_BASE64 nao configurada, build usara assinatura debug segura de fallback.')
          "

      - name: Create keystore.properties (if secret exists)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 -c "
          import os
          store_pass = os.environ.get('STORE_PASSWORD', '').strip()
          key_alias = os.environ.get('KEY_ALIAS', '').strip()
          key_pass = os.environ.get('KEY_PASSWORD', '').strip()
          if store_pass and key_alias and key_pass:
              with open('app/keystore.properties', 'w') as f:
                  f.write(f'storeFile=key01.jks\nstorePassword={store_pass}\nkeyAlias={key_alias}\nkeyPassword={key_pass}\n')
              print('keystore.properties gerado com sucesso.')
          else:
              print('Segredos de keystore ausentes, compilando com assinatura debug fallback.')
          "

      - name: Grant execute permission for gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Release APK with Gradle (R8 Minification)
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee assemble-output.log || {
            echo "==================== ASSEMBLE RELEASE ERROR SUMMARY ===================="
            tail -n 120 assemble-output.log || true
            exit 1
          }

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: assemble-output.log
          if-no-files-found: ignore

      - name: Clean up temporary keystore
        if: always()
        run: rm -f app/key01.jks app/keystore.properties keystore.properties

      - name: Prepare APK Artifacts
        run: |
          mkdir -p artifacts
          VERSION_TAG="${{ needs.check-version.outputs.version }}"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk artifacts/AudioVisualizer-${VERSION_TAG}.apk
            cp app/build/outputs/apk/release/app-release.apk artifacts/AudioVisualizer-release.apk
            ls -la artifacts/
          else
            echo "app-release.apk nao encontrado!"
            exit 1
          fi

      - name: Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: AudioVisualizer-Release-APK
          path: artifacts/AudioVisualizer-*.apk

      - name: Prepare Release Notes
        run: |
          awk 'BEGIN{p=1} /^---/{p=0} p{print}' CHANGELOG_LATEST.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "### Audio Visualizer ${{ needs.check-version.outputs.version }}" > RELEASE_NOTES.md
            echo "Lançamento inicial com balística precisa e compactação R8." >> RELEASE_NOTES.md
          fi
          cat >> RELEASE_NOTES.md <<EOF

          ---
          Compilado automaticamente a partir do commit \`${{ github.sha }}\`.
          EOF

      - name: Publish Test Pre-Release (branch test)
        if: github.ref == 'refs/heads/test'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.version }}-test
          name: "Audio Visualizer ${{ needs.check-version.outputs.version }} (Test Pre-release)"
          body_path: RELEASE_NOTES.md
          prerelease: true
          files: |
            artifacts/AudioVisualizer-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Official Release (branch main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          name: "Audio Visualizer ${{ needs.check-version.outputs.version }}"
          body_path: RELEASE_NOTES.md
          prerelease: false
          files: |
            artifacts/AudioVisualizer-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
